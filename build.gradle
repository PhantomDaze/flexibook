// Unified version-node buildscript for Stonecutter 0.6 + Gradle 8.11.
// plugins {} must be first (aside from buildscript). Loader is chosen after plugins.

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Always on classpath; only applied when mod_loader=forge
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.36'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'dev.kikugie.stonecutter'
    // Applied only when mod_loader=neoforge (see below). Version from pluginManagement.
    id 'net.neoforged.moddev' apply false
    // Applied only when mod_loader=fabric.
    id 'fabric-loom' apply false
}

// Load versions/<ver>/gradle.properties into project.ext
def versionPropsFile = file('gradle.properties')
if (versionPropsFile.isFile()) {
    versionPropsFile.eachLine('UTF-8') { raw ->
        def line = raw.trim()
        if (line.isEmpty() || line.startsWith('#') || !line.contains('=')) return
        def idx = line.indexOf('=')
        def key = line.substring(0, idx).trim()
        def value = line.substring(idx + 1).trim()
        if (!key.isEmpty()) {
            project.ext.set(key, value)
        }
    }
}

ext.projProp = { String name ->
    def v = project.findProperty(name)
    if (v == null && project.ext.has(name)) v = project.ext.get(name)
    if (v == null && rootProject.hasProperty(name)) v = rootProject.property(name)
    if (v == null) {
        throw new GradleException("$name missing (project=${project.path} dir=${project.projectDir})")
    }
    return v.toString()
}

['mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_group_id', 'mod_authors', 'mod_description'].each { k ->
    if (!project.ext.has(k) && rootProject.hasProperty(k)) {
        project.ext.set(k, rootProject.property(k).toString())
    }
}

def modLoader = projProp('mod_loader')
def mcVersion = projProp('minecraft_version')
def javaVer = Integer.parseInt(projProp('java_version'))
project.ext.modLoader = modLoader
project.ext.mcVersion = mcVersion
project.ext.javaVer = javaVer

group = projProp('mod_group_id')
version = "${projProp('mod_version')}+${mcVersion}"

if (modLoader == 'neoforge') {
    apply plugin: 'net.neoforged.moddev'
} else if (modLoader == 'forge') {
    apply plugin: 'net.minecraftforge.gradle'
} else if (modLoader == 'fabric') {
    apply plugin: 'fabric-loom'
} else {
    throw new GradleException("Unknown mod_loader='$modLoader'")
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.fabricmc.net/' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Sealed-type pattern switches are preview on Java 17 (1.20.1); final on 21.
    if (javaVer < 21) {
        options.compilerArgs += ['--enable-preview']
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (javaVer < 21) {
        jvmArgs += ['--enable-preview']
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def javaVerStr = projProp('java_version')
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : mcVersion,
            minecraft_version_range: projProp('minecraft_version_range'),
            neo_version            : project.ext.has('neo_version') ? project.ext.neo_version : '',
            forge_version          : project.ext.has('forge_version') ? project.ext.forge_version : '',
            loader_version_range   : projProp('loader_version_range'),
            mod_id                 : projProp('mod_id'),
            mod_name               : projProp('mod_name'),
            mod_license            : projProp('mod_license'),
            mod_version            : projProp('mod_version'),
            mod_loader             : modLoader,
            java_version           : javaVerStr,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    // Templates live on the monorepo root (Stonecutter version nodes sit under versions/<ver>/).
    from rootProject.file('src/main/templates')
    into layout.buildDirectory.dir('generated/sources/modMetadata')
    if (modLoader == 'forge') {
        exclude '**/neoforge.mods.toml'
        exclude '**/fabric.mod.json'
    } else if (modLoader == 'neoforge') {
        exclude '**/mods.toml'
        exclude '**/fabric.mod.json'
    } else if (modLoader == 'fabric') {
        exclude '**/mods.toml'
        exclude '**/neoforge.mods.toml'
        exclude '**/META-INF/**'
    }
}

sourceSets.main.resources {
    srcDir(rootProject.file('src/main/resources'))
    srcDir('src/generated/resources')
    srcDir(generateModMetadata)
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

sourceSets.test.resources.srcDir(rootProject.file('src/test/resources'))

// Node-local sources are an explicit extension point for loader/version adapters.
// Stonecutter still supplies shared sources (or chiseledSrc) for the common code;
// this directory adds only the current node's API-boundary glue.
sourceSets.main.java.srcDir('src/main/java')
sourceSets.test.java.srcDir('src/test/java')

afterEvaluate {
    def setupChiseled = tasks.named('setupChiseledBuild')
    tasks.withType(JavaCompile).configureEach {
        dependsOn(setupChiseled)
    }
    sourceSets.main.java.setSrcDirs([
            layout.buildDirectory.dir('chiseledSrc/main/java').get().asFile,
            file('src/main/java')
    ])
    sourceSets.test.java.setSrcDirs([
            layout.buildDirectory.dir('chiseledSrc/test/java').get().asFile,
            file('src/test/java')
    ])
}

tasks.withType(Jar).matching { it.name == 'sourcesJar' }.configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

base {
    archivesName = projProp('mod_id')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Stonecutter 0.6: //? if forge / //? if neoforge / //? if fabric
// MC 1.21.11+ renamed ResourceLocation → Identifier (and ResourceLocationArgument → IdentifierArgument).
// (Also covers NeoForge 26.x.) Map form omits identifier so replacements apply globally.
stonecutter {
    consts(modLoader, 'forge', 'neoforge', 'fabric')
    def isIdentifier = eval(current.version, '>=1.21.11')
    replacement(direction: isIdentifier, source: 'net.minecraft.commands.arguments.ResourceLocationArgument', target: 'net.minecraft.commands.arguments.IdentifierArgument', phase: 'FIRST')
    replacement(direction: isIdentifier, source: 'net.minecraft.resources.ResourceLocation', target: 'net.minecraft.resources.Identifier', phase: 'FIRST')
    replacement(direction: isIdentifier, source: 'ResourceLocationArgument', target: 'IdentifierArgument', phase: 'LAST')
    replacement(direction: isIdentifier, source: 'ResourceLocation', target: 'Identifier', phase: 'LAST')
}

if (modLoader == 'neoforge') {
    apply from: rootProject.file('gradle/neoforge.gradle')
} else if (modLoader == 'forge') {
    apply from: rootProject.file('gradle/forge.gradle')
} else if (modLoader == 'fabric') {
    apply from: rootProject.file('gradle/fabric.gradle')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}
