# FlexiBook 客户端 smoke workflow（仅手动触发）
#
# 自动 CI 已停用：不再由 build 工作流成功后（workflow_run）或任何 push 触发。
# 日常测试请本地运行：
#   bash scripts/test-all.sh            # 单元测试
#   bash scripts/test-all.sh --smoke    # 单元测试 + 全部 11 节点客户端 smoke
# 本地 smoke 需要显示环境：桌面会话（DISPLAY 已设置）或 xvfb-run -a。
# 本 workflow 仅保留作需要时手动触发（workflow_dispatch），在本机不便时使用。
#
# 只跑主构建的 Pass A（1.21.x 五节点）和可选 Pass B（26.x 四节点）：
#   - 不跑 Pass L（1.20.1）：legacy 构建需要 ForgeGradle 额外联网/暖缓存，
#     且 legacy 构建本身更慢，不适合托管 runner 的短 job。
#
# 手动触发参数：pass-a / pass-b / pass-a+b，默认 pass-a。

name: client-smoke

on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Which smoke passes to run"
        required: true
        default: pass-a
        type: choice
        options:
          - pass-a
          - pass-b
          - pass-a+b
      read_seconds:
        description: "Seconds to keep the book open (AutoSmoke readSeconds)"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client-smoke:
    name: client smoke (xvfb + llvmpipe)
    # GitHub 托管 runner：无 GPU，走 xvfb + Mesa llvmpipe 软件渲染（已实测可跑通）。
    runs-on: ubuntu-latest
    # 备选（带 GPU 的 self-hosted runner）：
    # runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    # 手动触发时 smoke 失败应让 workflow 变红。
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Pass A)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25 (Pass B)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Xvfb + Mesa software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Cache Gradle (both Plan B Gradle versions)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-g9.6.1-g8.14.3-main-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'legacy-gradle8/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'versions/*/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-g9.6.1-g8.14.3-main-

      # smokeAllClientsPassA 会为每个节点启动子 Gradle 进程；smokeJdk 会读取
      # JDK21 环境变量（见 stonecutter.gradle.kts 的 smokeJdk），这里显式指向
      # setup-java 安装的 JDK21。软件渲染较慢，timeoutSeconds 放大到 900。
      - name: Smoke Pass A — 1.21.x (JDK21, xvfb + llvmpipe)
        # pass-b 单独调度时跳过 Pass A，避免把 26.x 验证拖成完整门禁。
        if: github.event.inputs.passes != 'pass-b'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export JDK21="$JAVA_HOME_21_X64"
          READ_SECONDS="${{ github.event.inputs.read_seconds || '10' }}"
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew smokeAllClientsPassA \
              -Pflexibook.autoSmoke.readSeconds="$READ_SECONDS" \
              -Pflexibook.autoSmoke.timeoutSeconds=900 \
              --console=plain

      - name: Smoke Pass B — 26.x (JDK25, xvfb + llvmpipe)
        if: >-
          github.event.inputs.passes == 'pass-a+b' ||
          github.event.inputs.passes == 'pass-b'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          export JDK25="$JAVA_HOME_25_X64"
          READ_SECONDS="${{ github.event.inputs.read_seconds || '10' }}"
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew smokeAllClientsPassB \
              -Pflexibook.autoSmoke.readSeconds="$READ_SECONDS" \
              -Pflexibook.autoSmoke.timeoutSeconds=900 \
              --console=plain

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-smoke-logs
          path: |
            versions/*/run/logs/*.log
            versions/*/run/logs/*.log.gz
          if-no-files-found: ignore
