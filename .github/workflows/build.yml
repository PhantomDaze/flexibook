# FlexiBook CI — Plan B 双构建（阻塞型）
#
# 结构
#   build-main    Gradle 9.6.1 + MDG 2.0.143 + Loom 1.17.17 —— 9 个节点
#                 Pass A: 1.21.x（Gradle daemon JDK21，节点 toolchain 21）
#                 Pass B: 26.x   （Gradle daemon JDK25，节点 toolchain 25）
#   build-legacy  Gradle 8.14.3 + ForgeGradle 6.0.54 + Loom 1.13.6 —— 2 个节点
#                 1.20.1 Forge / 1.20.1 Fabric（daemon JDK21，节点 toolchain 17）
#
# 为什么必须拆成两套 Gradle（Plan B）
#   ForgeGradle 6 的 MCPRuntime.ExecuteFunction 在 Gradle 9.6.1 / 8.14.5 上以
#   "project services has been closed" 失败，只有 8.14.3 能完成冷 artifact 生成；
#   反过来 Loom 1.17.17 的 plugin api-version 是 9.5.0，无法在 Gradle 8 上加载。
#   因此 legacy 节点固定走 legacy-gradle8/ 的 8.14.3 wrapper +
#   settings.legacy.gradle.kts，主构建保持 9.6.1。
#
# 网络依赖（GitHub 托管 runner 有网，正常路径不需要额外处理）
#   - ForgeGradle 运行时需要 piston-meta.mojang.com（Minecraft 版本元数据）。
#   - NeoForge MDG / NFRT 每次 createMinecraftArtifacts 都会拉
#     version_manifest_v2.json（launchermeta.mojang.com），--offline 无效。
#   本地离线复跑需要暖缓存：ForgeGradle 的 etag 缓存只有 1 小时 TTL，可执行
#     find ~/.gradle/caches/forge_gradle -type f -exec touch {} +
#   刷新 mtime；MDG 的 manifest 下载没有离线开关，断网时只能复用已生成的 artifacts。
#
# 状态：本 workflow 已在 GitHub Actions 上首次运行并全绿（build 4m03s）。

name: build

on:
  push:
    branches: [unified, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_MAIN_VERSION: "9.6.1"
  GRADLE_LEGACY_VERSION: "8.14.3"

jobs:
  build-main:
    name: build-main (Gradle 9.6.1, 9 nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 同一次 job 里安装两个 JDK：最后一个会把 JAVA_HOME 指向 JDK25，
      # 两个都通过 JAVA_HOME_21_X64 / JAVA_HOME_25_X64 暴露给后续 step。
      - name: Set up JDK 21 (Pass A daemon + toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25 (Pass B daemon + toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle (both Plan B Gradle versions)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-g9.6.1-g8.14.3-main-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'legacy-gradle8/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'versions/*/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-g9.6.1-g8.14.3-main-

      # buildPassA/B 依赖每个节点的 :build，build 已包含 test（9 节点共 531 tests；
      # 与 legacy 2 节点合计 649 tests，下方统计 step 会打印实际数字）。
      - name: Build + test Pass A — 1.21.x (JDK 21)
        run: JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew buildPassA --console=plain --stacktrace

      - name: Build + test Pass B — 26.x (JDK 25)
        run: JAVA_HOME="$JAVA_HOME_25_X64" ./gradlew buildPassB --console=plain --stacktrace

      # 解析 Gradle 生成的 JUnit XML 并打印每节点用例数。
      # if: always() 保证测试失败时也能看到统计；解析失败只发 warning，不让 job 变红。
      - name: Report test totals — main
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          pattern = 'versions/*/build/test-results/test/*.xml'
          files = sorted(glob.glob(pattern))
          if not files:
              print(f'::warning::No JUnit XML found at {pattern} (tests may not have run)')
              sys.exit(0)

          per_node = defaultdict(lambda: [0, 0, 0, 0])
          parse_errors = []
          for path in files:
              node = path.split('/')[1]
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  parse_errors.append(f'{path}: {exc}')
                  continue
              values = [int(root.get(k, 0) or 0) for k in ('tests', 'failures', 'errors', 'skipped')]
              for i, v in enumerate(values):
                  per_node[node][i] += v

          header = f"{'node':24} {'tests':>7} {'failures':>9} {'errors':>7} {'skipped':>8}"
          print(header)
          print('-' * len(header))
          total = [0, 0, 0, 0]
          for node in sorted(per_node):
              c = per_node[node]
              print(f'{node:24} {c[0]:7} {c[1]:9} {c[2]:7} {c[3]:8}')
              for i, v in enumerate(c):
                  total[i] += v
          print('-' * len(header))
          summary = 'TOTAL (' + str(len(per_node)) + ' nodes)'
          print(f'{summary:24} {total[0]:7} {total[1]:9} {total[2]:7} {total[3]:8}')

          for msg in parse_errors:
              print(f'::warning::Failed to parse JUnit XML {msg}')
          sys.exit(0)
          PYEOF

      - name: Upload main jars (9)
        uses: actions/upload-artifact@v7
        with:
          name: flexibook-jars-main
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
          if-no-files-found: error

  build-legacy:
    name: build-legacy (Gradle 8.14.3, 1.20.1 x2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK21 作为 Gradle 8.14.3 daemon；JDK17 是 1.20.1 节点的 toolchain。
      - name: Set up JDK 21 (Gradle daemon)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 17 (toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle (both Plan B Gradle versions)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-g9.6.1-g8.14.3-legacy-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'legacy-gradle8/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'versions/*/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-g9.6.1-g8.14.3-legacy-

      # 两个节点分开跑：build-all.sh 也是按节点独立调用，避免 FG6/Loom 在同一
      # Gradle invocation 里互相干扰。JAVA_HOME 决定 daemon JVM，toolchain 17 由
      # org.gradle.java.installations.fromEnv 显式指向 setup-java 安装的 JDK17。
      - name: Build + test :1.20.1 (Forge, legacy-gradle8, Gradle 8.14.3)
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" ./legacy-gradle8/gradlew \
            -c settings.legacy.gradle.kts \
            -Pstonecutter.active=1.20.1-fabric \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 \
            :1.20.1:build --console=plain --stacktrace

      - name: Build + test :1.20.1-fabric (legacy-gradle8, Gradle 8.14.3)
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" ./legacy-gradle8/gradlew \
            -c settings.legacy.gradle.kts \
            -Pstonecutter.active=1.20.1-fabric \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 \
            :1.20.1-fabric:build --console=plain --stacktrace

      # 解析 Gradle 生成的 JUnit XML 并打印每节点用例数。
      # if: always() 保证测试失败时也能看到统计；解析失败只发 warning，不让 job 变红。
      - name: Report test totals — legacy
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          pattern = 'versions/*/build/test-results/test/*.xml'
          files = sorted(glob.glob(pattern))
          if not files:
              print(f'::warning::No JUnit XML found at {pattern} (tests may not have run)')
              sys.exit(0)

          per_node = defaultdict(lambda: [0, 0, 0, 0])
          parse_errors = []
          for path in files:
              node = path.split('/')[1]
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  parse_errors.append(f'{path}: {exc}')
                  continue
              values = [int(root.get(k, 0) or 0) for k in ('tests', 'failures', 'errors', 'skipped')]
              for i, v in enumerate(values):
                  per_node[node][i] += v

          header = f"{'node':24} {'tests':>7} {'failures':>9} {'errors':>7} {'skipped':>8}"
          print(header)
          print('-' * len(header))
          total = [0, 0, 0, 0]
          for node in sorted(per_node):
              c = per_node[node]
              print(f'{node:24} {c[0]:7} {c[1]:9} {c[2]:7} {c[3]:8}')
              for i, v in enumerate(c):
                  total[i] += v
          print('-' * len(header))
          summary = 'TOTAL (' + str(len(per_node)) + ' nodes)'
          print(f'{summary:24} {total[0]:7} {total[1]:9} {total[2]:7} {total[3]:8}')

          for msg in parse_errors:
              print(f'::warning::Failed to parse JUnit XML {msg}')
          sys.exit(0)
          PYEOF

      - name: Upload legacy jars (2)
        uses: actions/upload-artifact@v7
        with:
          name: flexibook-jars-legacy
          path: |
            versions/1.20.1/build/libs/*.jar
            versions/1.20.1-fabric/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
