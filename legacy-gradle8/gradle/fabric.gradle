// Fabric Loom configuration for fabric version nodes.
// Applied from build.gradle when mod_loader=fabric.

def mc = project.findProperty('minecraft_version') ?: project.ext.minecraft_version
def loaderVer = project.findProperty('loader_version') ?: project.ext.loader_version
def fabricApi = project.findProperty('fabric_api_version') ?: project.ext.fabric_api_version
def modId = project.findProperty('mod_id') ?: project.ext.mod_id

// Smoke switches. Prefer the unified flexibook.autoSmoke* names; keep accepting
// the old flexibook.smokeTest* names. Smoke aggregate tasks enable it implicitly
// so a single `smokeAllClients` invocation needs no extra -P flags.
def smokeProp = { String unified, String legacy, String fallback ->
    def v = project.findProperty(unified) ?: project.findProperty(legacy)
    return v == null ? fallback : v.toString()
}
def smokeExplicit = project.findProperty('flexibook.autoSmoke') ?: project.findProperty('flexibook.smokeTest')
def smokeTaskNames = ['smokeAllClients', 'smokeAllClientsPassL', 'smokeTestAllClients']
def smokeEnabled = smokeExplicit != null
        ? smokeExplicit.toString() == 'true'
        : gradle.startParameter.taskNames.any { it.substring(it.lastIndexOf(':') + 1) in smokeTaskNames }
def smokeReadSeconds = smokeProp('flexibook.autoSmoke.readSeconds', 'flexibook.smokeTest.readSeconds', '10')
def smokeTimeoutSeconds = smokeProp('flexibook.autoSmoke.timeoutSeconds', 'flexibook.smokeTest.timeoutSeconds', '300')
def javaVer = project.ext.javaVer as Integer

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    // Mojmap so shared sources match Forge/NeoForge official mappings.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVer}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    // Tooltip @Nullable on 1.20.1 (no JSR-305 on Fabric classpath by default).
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

loom {
    // Single main sourceset (no split client) — server-safe via reflective screen open.
    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }

    // Fabric API jars often ship named javadoc; Loom requires intermediary → break mojmap setups.
    enableModProvidedJavadoc = false
    enableTransitiveAccessWideners = true

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated true
            runDir 'run'
            // Client smoke: -Pflexibook.autoSmoke=true (or legacy -Pflexibook.smokeTest=true),
            // or any smoke aggregate task (smokeAllClients / smokeAllClientsPassL / smokeTestAllClients).
            // The shared source AutoSmokeClient only understands flexibook.autoSmoke*.
            if (smokeEnabled) {
                property 'flexibook.autoSmoke', 'true'
                property 'flexibook.autoSmoke.readSeconds', smokeReadSeconds
                property 'flexibook.autoSmoke.timeoutSeconds', smokeTimeoutSeconds
                property 'flexibook.autoSmoke.dir', rootProject.file('dev/smoke').absolutePath
                property 'flexibook.autoSmoke.resourcePacksDir',
                        rootProject.file('dev/smoke/resourcepacks').absolutePath
            }
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated true
            runDir 'run'
        }
    }
}

processResources {
    // fabric.mod.json is produced by generateModMetadata into generated resources.
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/neoforge.mods.toml'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Loom remapJar is the distribution artifact.
tasks.named('build').configure {
    dependsOn 'remapJar'
}
