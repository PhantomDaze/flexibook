// ForgeGradle 6 configuration for the 1.20.1 version node.
// Applied from build.gradle.kts / build.forge.gradle when mod_loader=forge.
// Version props are on project.ext from versions/1.20.1/gradle.properties.

def mc = project.findProperty('minecraft_version') ?: project.ext.minecraft_version
def fg = project.findProperty('forge_version') ?: project.ext.forge_version
def modId = project.findProperty('mod_id') ?: project.ext.mod_id

// Smoke switches. Prefer the unified flexibook.autoSmoke* names; keep accepting
// the old flexibook.smokeTest* names. Smoke aggregate tasks enable it implicitly
// so a single `smokeAllClients` invocation needs no extra -P flags.
def smokeProp = { String unified, String legacy, String fallback ->
    def v = project.findProperty(unified) ?: project.findProperty(legacy)
    return v == null ? fallback : v.toString()
}
def smokeExplicit = project.findProperty('flexibook.autoSmoke') ?: project.findProperty('flexibook.smokeTest')
def smokeTaskNames = ['smokeAllClients', 'smokeAllClientsPassL', 'smokeTestAllClients']
def smokeEnabled = smokeExplicit != null
        ? smokeExplicit.toString() == 'true'
        : gradle.startParameter.taskNames.any { it.substring(it.lastIndexOf(':') + 1) in smokeTaskNames }
def smokeReadSeconds = smokeProp('flexibook.autoSmoke.readSeconds', 'flexibook.smokeTest.readSeconds', '10')
def smokeTimeoutSeconds = smokeProp('flexibook.autoSmoke.timeoutSeconds', 'flexibook.smokeTest.timeoutSeconds', '300')

// Official mappings first — Parchment on FG6 needs the parchment plugin + specific channel setup.
// Names may be slightly less readable on 1.20.1; functional compile is the goal.
minecraft {
    mappings channel: 'official', version: mc

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', modId
            // Client smoke: -Pflexibook.autoSmoke=true (or the legacy -Pflexibook.smokeTest=true),
            // or any smoke aggregate task (smokeAllClients / smokeAllClientsPassL / smokeTestAllClients).
            // The shared source AutoSmokeClient only understands flexibook.autoSmoke*.
            if (smokeEnabled) {
                property 'flexibook.autoSmoke', 'true'
                property 'flexibook.autoSmoke.readSeconds', smokeReadSeconds
                property 'flexibook.autoSmoke.timeoutSeconds', smokeTimeoutSeconds
                property 'flexibook.autoSmoke.dir', rootProject.file('dev/smoke').absolutePath
                property 'flexibook.autoSmoke.resourcePacksDir',
                        rootProject.file('dev/smoke/resourcepacks').absolutePath
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', modId
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', modId, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc}-${fg}"
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
