# Shared Gradle JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Dual FG6 + MDG graphs are brittle under configuration-cache.
org.gradle.configuration-cache=false

# FG6 gates Gradle < 9.0; Stonecutter 0.9 requires Gradle 9+.
# Disable the hard fail — FG6 still works on 9.2 for this project in practice.
systemProp.net.minecraftforge.gradle.check.gradle=false

# Acknowledge Stonecutter Groovy note (we use Kotlin DSL primarily).
dev.kikugie.stonecutter.hard_mode=true

# Minecraft 26.x requires the Gradle process itself to run on Java 25.
# Version nodes still compile with their configured Java toolchain.
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk

## Mod Properties (shared across versions)
mod_id=flexibook
mod_name=FlexiBook
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=io.github.PhantomDaze.flexibook
mod_authors=PhantomDaze
mod_description=Adaptive layout written books with an HTML-subset markup, i18n-aware reflow, and a custom screen.

# Allow Gradle Foojay to provision missing toolchains (FG MCP needs JDK 17 launcher).
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true
