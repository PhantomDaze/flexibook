// NeoForge / ModDevGradle configuration for neoforge version nodes.
// Applied from build.gradle when mod_loader=neoforge.

def neoVer = project.findProperty('neo_version') ?: project.ext.neo_version
def parchMc = project.findProperty('parchment_minecraft_version')
        ?: (project.ext.has('parchment_minecraft_version') ? project.ext.parchment_minecraft_version : null)
def parchVer = project.findProperty('parchment_mappings_version')
        ?: (project.ext.has('parchment_mappings_version') ? project.ext.parchment_mappings_version : null)
def modId = project.findProperty('mod_id') ?: project.ext.mod_id

neoForge {
    version = neoVer

    // Optional — MC 26.x may not have Parchment yet; omit props to use official mappings.
    if (parchMc && parchVer) {
        parchment {
            mappingsVersion = parchVer
            minecraftVersion = parchMc
        }
    }

    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
            systemProperty 'fml.earlyWindowControl', 'false'
            systemProperty 'fml.earlyProgressWindow', 'false'
            jvmArgument '-Dfml.earlyWindowControl=false'
        }

        // Auto smoke: enable dev/smoke packs -> create world -> open book -> read -> quit.
        clientAutoSmoke {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
            systemProperty 'fml.earlyWindowControl', 'false'
            systemProperty 'fml.earlyProgressWindow', 'false'
            systemProperty 'flexibook.autoSmoke', 'true'
            systemProperty 'flexibook.autoSmoke.readSeconds', '10'
            systemProperty 'flexibook.autoSmoke.timeoutSeconds', '180'
            systemProperty 'flexibook.autoSmoke.dir', rootProject.file('dev/smoke').absolutePath
            systemProperty 'flexibook.autoSmoke.resourcePacksDir', rootProject.file('dev/smoke/resourcepacks').absolutePath
            jvmArgument '-Dfml.earlyWindowControl=false'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        // MC 1.21.4+ split data gen into clientData/serverData (MDG RunModel).
        // 1.21.3 and earlier still use the combined data() run type.
        def dataArgs = ['--mod', modId, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath]
        def mc = (project.findProperty('minecraft_version') ?: project.ext.minecraft_version).toString()
        // Combined data() only through 1.21.3; 1.21.4+ and 26.x need clientData/serverData.
        def useCombinedData = mc ==~ /^1\.(20(\.\d+)?|21(\.[0-3])?)$/
        if (useCombinedData) {
            data {
                data()
                programArguments.addAll dataArgs
            }
        } else {
            clientData {
                clientData()
                programArguments.addAll dataArgs
            }
            serverData {
                serverData()
                programArguments.addAll dataArgs
            }
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
}

try {
    neoForge.ideSyncTask tasks.named('generateModMetadata')
} catch (Throwable ignored) {
}

configurations {
    if (findByName('localRuntime') != null) {
        runtimeClasspath.extendsFrom localRuntime
    } else {
        create('localRuntime')
        runtimeClasspath.extendsFrom localRuntime
    }
}
