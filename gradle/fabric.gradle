// Fabric Loom configuration for fabric version nodes.
// Applied from build.gradle when mod_loader=fabric.

def mc = project.findProperty('minecraft_version') ?: project.ext.minecraft_version
def loaderVer = project.findProperty('loader_version') ?: project.ext.loader_version
def fabricApi = project.findProperty('fabric_api_version') ?: project.ext.fabric_api_version
def modId = project.findProperty('mod_id') ?: project.ext.mod_id
def javaVer = project.ext.javaVer as Integer
// MC 26.x ships Mojang-named (unobfuscated); use Loom NoRemap plugin path.
def unobfuscatedMc = mc.toString().startsWith('26.')

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (unobfuscatedMc) {
        // NoRemap plugin has no modImplementation — official example-mod uses implementation.
        // Fabric API POM still pulls module jars onto the compile classpath.
        implementation "net.fabricmc:fabric-loader:${loaderVer}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    } else {
        // Mojmap so shared sources match Forge/NeoForge official mappings.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loaderVer}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }
    // Tooltip @Nullable on 1.20.1 (no JSR-305 on Fabric classpath by default).
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

loom {
    // Single main sourceset (no split client) — server-safe via reflective screen open.
    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }

    // Fabric API jars often ship named javadoc; Loom requires intermediary → break mojmap setups.
    enableModProvidedJavadoc = false
    // Needed so FAPI transitive-accessible entries (e.g. CreativeModeTab$Output) apply at compile.
    enableTransitiveAccessWideners = true

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated true
            runDir 'run'
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated true
            runDir 'run'
        }
        // Auto smoke: create world → open demo book → read → quit (see AutoSmokeClient).
        clientAutoSmoke {
            client()
            setConfigName("Fabric Client AutoSmoke")
            ideConfigGenerated true
            runDir 'run'
            property 'flexibook.autoSmoke', 'true'
            property 'flexibook.autoSmoke.readSeconds', '10'
            property 'flexibook.autoSmoke.timeoutSeconds', '180'
        }
    }
}

processResources {
    // fabric.mod.json is produced by generateModMetadata into generated resources.
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/neoforge.mods.toml'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (javaVer < 21) {
        options.compilerArgs += ['--enable-preview']
    }
}

// Remap plugin: remapJar is the distribution artifact.
// NoRemap plugin: jar itself is already the distributable.
tasks.named('build').configure {
    if (tasks.findByName('remapJar') != null) {
        dependsOn 'remapJar'
    }
}
